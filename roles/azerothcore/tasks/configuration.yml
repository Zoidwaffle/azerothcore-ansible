---
#####################
# Folder creation
#####################

- name: Create server log folder
  ansible.builtin.file:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/log"
    state: "directory"
    mode: "0755"
    owner: "{{ azerothcore_user }}"
    group: "{{ azerothcore_user }}"

#####################
# Existing configuration files
#####################

- name: Check if previous server configuration exists
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc/"
  register: azerothcore_previousserver_conf

- name: Find all files present from previous server
  ansible.builtin.find:
    paths: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc"
    file_type: file
    recurse: false
  register: azerothcore_previousserver_files
  when: azerothcore_previousserver_conf.stat.exists is defined and azerothcore_previousserver_conf.stat.exists

# Copy all old files, but don't overwrite any existing files
- name: Copy all previous configuration files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/"
    force: false # This is important
    remote_src: true
    mode: "preserve"
  with_items:
    - "{{ azerothcore_previousserver_files.files }}"
  when: azerothcore_previousserver_conf.stat.exists is defined and azerothcore_previousserver_conf.stat.exists

- name: Check if previous module configuration exists
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc/modules/"
  register: azerothcore_previousmodule_conf

- name: Find all files present from previous modules
  ansible.builtin.find:
    paths: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc/modules"
    file_type: file
    recurse: false
  register: azerothcore_previousmodule_files
  when: azerothcore_previousmodule_conf.stat.exists is defined and azerothcore_previousmodule_conf.stat.exists

# Copy all old files, but don't overwrite any existing files
- name: Copy all previous module configuration files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/modules/"
    force: false # This is important
    remote_src: true
    mode: "preserve"
  with_items:
    - "{{ azerothcore_previousmodule_files.files }}"
  when: azerothcore_previousmodule_conf.stat.exists is defined and azerothcore_previousmodule_conf.stat.exists

- name: Check if previous LUA exists
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/bin/lua_scripts/"
  register: azerothcore_previouslua

- name: Find all files present from previous LUA
  ansible.builtin.find:
    paths: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/bin/lua_scripts"
    file_type: file
    recurse: false
  register: azerothcore_previousmodule_files
  when: azerothcore_previouslua.stat.exists is defined and azerothcore_previouslua.stat.exists

# Copy all old files, but don't overwrite any existing files
- name: Copy all previous LUA files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/bin/lua_scripts/"
    force: false # This is important
    remote_src: true
    mode: "preserve"
  with_items:
    - "{{ azerothcore_previousmodule_files.files }}"
  when: azerothcore_previouslua.stat.exists is defined and azerothcore_previouslua.stat.exists

#####################
# Existing DBC files
#####################

- name: Find all DBC files present from previous server
  ansible.builtin.find:
    paths: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/data/dbc"
    file_type: file
    recurse: false
  register: azerothcore_dbc_files
  when: azerothcore_previousserver_conf.stat.exists is defined and azerothcore_previousserver_conf.stat.exists

# There might be custom DBC files, such as from the "mod-arac" module
- name: Copy all previous non-existant DBC files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/data/dbc/"
    force: false # This is important
    remote_src: true
    mode: "preserve"
  with_items:
    - "{{ azerothcore_dbc_files.files }}"
  when: azerothcore_previousserver_conf.stat.exists is defined and azerothcore_previousserver_conf.stat.exists

#####################
# New configuration files
#####################

- name: Check if previous 'worldserver.conf' exists
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc/worldserver.conf"
  register: azerothcore_worldserver_conf

- name: Copy new 'worldserver.conf'
  ansible.builtin.copy:
    src: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/worldserver.conf.dist"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/worldserver.conf"
    remote_src: true
    mode: "preserve"
  when: azerothcore_worldserver_conf.stat.exists is defined and azerothcore_worldserver_conf.stat.exists == false

- name: Modify new 'worldserver.conf'
  ansible.builtin.lineinfile:
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/worldserver.conf"
    regexp: "{{ item.regexmatch }}"
    line: "{{ item.insertstring }}"
  with_items:
    - { regexmatch: '^DataDir =', insertstring: 'DataDir = "../data"' }
    - { regexmatch: '^LogsDir =', insertstring: 'LogsDir = "../log"' }
    - { regexmatch: '^LoginDatabaseInfo ', insertstring: 'LoginDatabaseInfo = "{{ azerothcore_db_server }};3306;{{ azerothcore_db_user }};{{ azerothcore_db_password }};{{ azerothcore_db_auth }}"' }
    - { regexmatch: '^WorldDatabaseInfo ', insertstring: 'WorldDatabaseInfo = "{{ azerothcore_db_server }};3306;{{ azerothcore_db_user }};{{ azerothcore_db_password }};{{ azerothcore_db_world }}"' }
    - { regexmatch: '^CharacterDatabaseInfo ', insertstring: 'CharacterDatabaseInfo = "{{ azerothcore_db_server }};3306;{{ azerothcore_db_user }};{{ azerothcore_db_password }};{{ azerothcore_db_characters }}"' }
  when: azerothcore_worldserver_conf.stat.exists is defined and azerothcore_worldserver_conf.stat.exists == false

- name: Check if previous 'authserver.conf' exists
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server }}/etc/authserver.conf"
  register: azerothcore_authserver_conf

- name: Copy new 'authserver.conf'
  ansible.builtin.copy:
    src: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/authserver.conf.dist"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/authserver.conf"
    remote_src: true
    mode: "preserve"
  when: azerothcore_authserver_conf.stat.exists is defined and azerothcore_authserver_conf.stat.exists == false

- name: Modify new 'authserver.conf'
  ansible.builtin.lineinfile:
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/etc/authserver.conf"
    regexp: "{{ item.regexmatch }}"
    line: "{{ item.insertstring }}"
  with_items:
    - { regexmatch: '^LoginDatabaseInfo ', insertstring: 'LoginDatabaseInfo = "{{ azerothcore_db_server }};3306;{{ azerothcore_db_user }};{{ azerothcore_db_password }};{{ azerothcore_db_auth }}"' }
    - { regexmatch: '^LogsDir =', insertstring: 'LogsDir = "../log"' }
  when: azerothcore_authserver_conf.stat.exists is defined and azerothcore_authserver_conf.stat.exists == false

#####################
# Database script
#####################

- name: Copy 'config.sh' from the source
  ansible.builtin.copy:
    src: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/conf/dist/config.sh"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/conf/"
    remote_src: true
    mode: "preserve"

- name: Modify 'config.sh'
  ansible.builtin.replace:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/conf/dist/config.sh"
    regexp: "{{ item.regexmatch }}"
    replace: "{{ item.replace }}"
  with_items:
    - { regexmatch: "MYSQL_USER='.*';", replace: "MYSQL_USER='{{ azerothcore_db_user }}'" }
    - { regexmatch: "MYSQL_PASS='.*';", replace: "MYSQL_PASS='{{ azerothcore_db_password }}'" }
    - { regexmatch: "MYSQL_HOST='.*';", replace: "MYSQL_HOST='{{ azerothcore_db_server }}'" }
    - { regexmatch: "^DB_AUTH_NAME=.*", replace: 'DB_AUTH_NAME="{{ azerothcore_db_auth }}"' }
    - { regexmatch: "^DB_CHARACTERS_NAME=.*", replace: 'DB_CHARACTERS_NAME="{{ azerothcore_db_characters }}"' }
    - { regexmatch: "^DB_WORLD_NAME=.*", replace: 'DB_WORLD_NAME="{{ azerothcore_db_world }}"' }

#####################
# Systemd files
#####################

- name: Copy systemd files for easy stop/start/restart
  ansible.builtin.template:
    src: "etc/systemd/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - authserver.service
    - worldserver.service
  become: true
  register: azerothcore_systemd_files

- name: Enable systemd services
  ansible.builtin.systemd:
    daemon_reload: true
    enabled: true
    name:
      - authserver
      - worldserver
  become: true
  when: azerothcore_service == "enabled"
