---
#####################
# Main source code
#####################

- name: Checkout AzerothCore code
  ansible.builtin.git:
    repo: "{{ azerothcore_git }}"
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}"
    version: "{{ azerothcore_branch }}"
    force: "{{ azerothcore_git_force }}"
  become: true
  become_user: "{{ azerothcore_user }}"

#####################
# Do we have updates or not...
#####################

- name: Get the latest (short) Git commit tag
  ansible.builtin.shell: cd "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}" && git rev-parse --short=6 $(git rev-parse HEAD)
  register: azerothcore_git_commit_tag

- name: Use last commit as name reference
  ansible.builtin.set_fact:
    azerothcore_server_release: "{{ azerothcore_server }}_{{ azerothcore_branch }}_{{ azerothcore_git_commit_tag.stdout }}"

# If this folder exists, we already compiled the current version...
- name: Check if the current version is compiled already
  ansible.builtin.stat:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}"
  register: azerothcore_release_folder

- name: Information if we don't need to compile
  ansible.builtin.debug:
    msg: "Server for release {{ azerothcore_git_commit_tag.stdout }} already exists, will exit"
  when: azerothcore_release_folder.stat.exists

- ansible.builtin.meta: end_play
  when: azerothcore_release_folder.stat.exists

#####################
# Custom modules
#####################

- name: Look for modules
  ansible.builtin.find:
    paths: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/modules/"
    recurse: false
    file_type: directory
  register: azerothcore_modules_folder

- name: Update modules
  ansible.builtin.shell: cd "{{ item.path }}" && git pull
  with_items:
    - "{{ azerothcore_modules_folder.files }}"
  when: azerothcore_modules_folder is defined and azerothcore_modules_folder != ""

#####################
# Build
#####################

- name: Remove previous build folder
  ansible.builtin.file:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build"
    state: "absent"

- name: Create new build folder
  ansible.builtin.file:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build"
    mode: "0755"
    state: "directory"
    owner: "{{ azerothcore_user }}"
    group: "{{ azerothcore_user }}"

- name: Debug - configure before compiling
  ansible.builtin.debug:
    msg: 'cd "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build" && cmake ../ -G Ninja -DCMAKE_INSTALL_PREFIX="/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}" -DCMAKE_C_COMPILER={{ azerothcore_compiler }} -DCMAKE_CXX_COMPILER={{ azerothcore_compiler_xx }} -DWITH_WARNINGS=1 -DTOOLS_BUILD={{ azerothcore_tools }} -DSCRIPTS=static -DENABLE_EXTRAS={{ azerothcore_debug }} -DENABLE_EXTRA_LOGS={{ azerothcore_debug }}'

- name: Configure before compiling
  ansible.builtin.shell: cd "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build" && cmake ../ -G Ninja -DCMAKE_INSTALL_PREFIX="/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}" -DCMAKE_C_COMPILER={{ azerothcore_compiler }} -DCMAKE_CXX_COMPILER={{ azerothcore_compiler_xx }} -DWITH_WARNINGS=1 -DTOOLS_BUILD={{ azerothcore_tools }} -DSCRIPTS=static -DMODULES_STATIC=static -DENABLE_EXTRAS={{ azerothcore_debug }} -DENABLE_EXTRA_LOGS={{ azerothcore_debug }}
  become: true
  become_user: "{{ azerothcore_user }}"

- name: Compiling register start
  ansible.builtin.set_fact:
    azerothcore_compile_start: "{{ now() }}"

- name: Compile AzerothCore server
  ansible.builtin.shell: cd "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build" && ninja
  async: 7200
  poll: 15
  become: true
  become_user: "{{ azerothcore_user }}"

- name: Compiling register end
  ansible.builtin.set_fact:
    azerothcore_compile_end: "{{ now() }}"

- name: Print execution time
  ansible.builtin.debug:
    msg: "Long operation start: {{ azerothcore_compile_start }}, end: {{ azerothcore_compile_end }}"

- name: Install AzerothCore server
  ansible.builtin.shell: cd "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_source }}/build" && ninja install
  become: true
  become_user: "{{ azerothcore_user }}"

#####################
# Add database file
#####################

- name: Create new tmp folder
  ansible.builtin.file:
    path: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/tmp"
    mode: "0755"
    state: "directory"
    owner: "{{ azerothcore_user }}"
    group: "{{ azerothcore_user }}"

- name: Add file for MySQL
  ansible.builtin.copy:
    dest: "/home/{{ azerothcore_user }}/{{ azerothcore_folder }}/{{ azerothcore_server_release }}/tmp/mysql_ac.conf"
    content: |
      [client]
      password = "{{ azerothcore_db_password }}"
